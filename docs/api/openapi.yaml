openapi: 3.1.0
info:
  title: Museum Admin API
  version: 0.2.0
  description: >-
    Canonical contract for the Phase 2 administration MVP. Clients may provide
    an RFC 4122 UUID in X-Correlation-ID; the API returns the accepted or
    generated value in response metadata and the X-Correlation-ID response header.
servers:
  - url: /api
    description: Same-origin web proxy
  - url: http://localhost:3000
    description: Local NestJS API
tags:
  - name: Authentication
  - name: Catalogs
  - name: Terms
  - name: Artifacts
  - name: Users
  - name: Operations
paths:
  /:
    get:
      tags: [Operations]
      operationId: livenessProbe
      description: Bare liveness response retained for operational tooling.
      responses:
        '200':
          description: API process is running.
          content:
            text/plain:
              schema: { type: string, example: Hello World! }
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated principal; session is set in an HttpOnly cookie.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
  /auth/me:
    get:
      tags: [Authentication]
      operationId: currentUser
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Current authenticated principal.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Session revoked and cookie cleared. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /catalogs:
    get:
      tags: [Catalogs]
      operationId: listCatalogs
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Active catalogs.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Catalog' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Catalogs]
      operationId: createCatalog
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCatalogRequest' }
      responses:
        '201':
          description: Catalog created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Catalog' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /catalogs/{catalogId}/terms:
    parameters:
      - $ref: '#/components/parameters/CatalogIdPath'
    get:
      tags: [Terms]
      operationId: listTerms
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Terms in a catalog with Vietnamese labels.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Term' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Terms]
      operationId: createTerm
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTermRequest' }
      responses:
        '201':
          description: Term created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Term' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /terms/{termId}:
    parameters:
      - $ref: '#/components/parameters/TermIdPath'
    patch:
      tags: [Terms]
      operationId: updateTerm
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTermRequest' }
      responses:
        '200':
          description: Term updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Term' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Terms]
      operationId: archiveTerm
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionRequest' }
      responses:
        '200':
          description: Term archived.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ArchiveResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /artifacts:
    get:
      tags: [Artifacts]
      operationId: listArtifacts
      security: [{ sessionCookie: [] }]
      parameters:
        - in: query
          name: search
          schema: { type: string, maxLength: 100 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Artifact records matching the query.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ArtifactPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Artifacts]
      operationId: createArtifact
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateArtifactRequest' }
      responses:
        '201':
          description: Artifact created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Artifact' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /artifacts/{artifactId}:
    parameters:
      - $ref: '#/components/parameters/ArtifactIdPath'
    get:
      tags: [Artifacts]
      operationId: getArtifact
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Artifact details.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Artifact' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Artifacts]
      operationId: updateArtifact
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateArtifactRequest' }
      responses:
        '200':
          description: Artifact updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Artifact' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Artifacts]
      operationId: archiveArtifact
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionRequest' }
      responses:
        '200':
          description: Artifact archived.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ArchiveResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /health:
    get:
      tags: [Operations]
      operationId: readinessProbe
      description: Operational probe intentionally returns a bare payload for container health checks.
      responses:
        '200':
          description: Dependencies are ready.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
        '500': { $ref: '#/components/responses/InternalError' }
  /users:
    get:
      tags: [Users]
      operationId: listUsers
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Internal user directory without password or session data.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/AdminUser' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Users]
      operationId: createUser
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: User created and audit event recorded.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /users/roles:
    get:
      tags: [Users]
      operationId: listAssignableRoles
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Roles whose permissions are all held by the current actor.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/AssignableRole' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserIdPath'
    patch:
      tags: [Users]
      operationId: updateUser
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200':
          description: User updated; active sessions are revoked on disable.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: museum_session
  parameters:
    CatalogIdPath:
      in: path
      name: catalogId
      required: true
      schema: { type: string, format: uuid }
    TermIdPath:
      in: path
      name: termId
      required: true
      schema: { type: string, format: uuid }
    ArtifactIdPath:
      in: path
      name: artifactId
      required: true
      schema: { type: string, format: uuid }
    UserIdPath:
      in: path
      name: userId
      required: true
      schema: { type: string, format: uuid }
  schemas:
    Meta:
      type: object
      required: [correlationId]
      properties:
        correlationId: { type: string, format: uuid }
    Envelope:
      type: object
      required: [data, meta]
      properties:
        data: {}
        meta: { $ref: '#/components/schemas/Meta' }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details, correlationId]
          properties:
            code: { $ref: '#/components/schemas/ApiErrorCode' }
            message: { type: string }
            details: {}
            correlationId: { type: string, format: uuid }
    ApiErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - UNAUTHORIZED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - CONCURRENCY_CONFLICT
        - RATE_LIMITED
        - REQUEST_ERROR
        - INTERNAL_ERROR
    User:
      type: object
      required: [id, email, displayName, permissions]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        permissions: { type: array, items: { type: string } }
    AdminUser:
      type: object
      required: [id, email, displayName, status, version, createdAt, roles]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        roles: { type: array, items: { $ref: '#/components/schemas/AssignableRoleSummary' } }
    AssignableRoleSummary:
      type: object
      required: [id, code, name]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
    AssignableRole:
      allOf:
        - $ref: '#/components/schemas/AssignableRoleSummary'
        - type: object
          required: [permissions]
          properties:
            permissions: { type: array, items: { type: string } }
    Catalog:
      type: object
      required: [id, code, name]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        _count:
          type: object
          required: [terms]
          properties:
            terms: { type: integer }
    TermTranslation:
      type: object
      required: [locale, label]
      properties:
        locale: { type: string, example: vi }
        label: { type: string }
        description: { type: [string, 'null'] }
    Term:
      type: object
      required: [id, catalogId, parentId, code, version, translations]
      properties:
        id: { type: string, format: uuid }
        catalogId: { type: string, format: uuid }
        parentId: { type: [string, 'null'], format: uuid }
        code: { type: string }
        version: { type: integer }
        translations: { type: array, items: { $ref: '#/components/schemas/TermTranslation' } }
        _count:
          type: object
          required: [children, artifactLinks]
          properties:
            children: { type: integer }
            artifactLinks: { type: integer }
    ArtifactPage:
      type: object
      required: [items, hasMore]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Artifact' } }
        hasMore: { type: boolean }
    ArtifactTranslation:
      type: object
      required: [locale, title, descriptionText]
      properties:
        locale: { type: string, example: vi }
        title: { type: string }
        descriptionText: { type: string }
    ArtifactTerm:
      type: object
      required: [term]
      properties:
        term: { $ref: '#/components/schemas/Term' }
    Artifact:
      type: object
      required: [id, accessionNumber, status, version, updatedAt, translations, terms]
      properties:
        id: { type: string, format: uuid }
        accessionNumber: { type: string }
        status: { type: string, example: DRAFT }
        version: { type: integer, minimum: 1 }
        updatedAt: { type: string, format: date-time }
        translations: { type: array, items: { $ref: '#/components/schemas/ArtifactTranslation' } }
        terms: { type: array, items: { $ref: '#/components/schemas/ArtifactTerm' } }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 1, maxLength: 1024, format: password }
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [email, displayName, initialPassword, roleIds, reason]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        displayName: { type: string, minLength: 1, maxLength: 120 }
        initialPassword: { type: string, minLength: 12, maxLength: 1024, format: password }
        roleIds: { type: array, minItems: 1, maxItems: 50, uniqueItems: true, items: { type: string, format: uuid } }
        reason: { type: string, minLength: 3, maxLength: 500 }
    UpdateUserRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        displayName: { type: string, minLength: 1, maxLength: 120 }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        roleIds: { type: array, maxItems: 50, uniqueItems: true, items: { type: string, format: uuid } }
        reason: { type: string, minLength: 3, maxLength: 500 }
    CreateCatalogRequest:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code: { type: string, minLength: 2, maxLength: 50, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$' }
        name: { type: string, minLength: 1, maxLength: 120 }
    CreateTermRequest:
      type: object
      additionalProperties: false
      required: [code, label]
      properties:
        code: { type: string, minLength: 1, maxLength: 100 }
        label: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        parentId: { type: [string, 'null'], format: uuid }
    UpdateTermRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        code: { type: string, minLength: 1, maxLength: 100 }
        label: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        parentId: { type: [string, 'null'], format: uuid }
    CreateArtifactRequest:
      type: object
      additionalProperties: false
      required: [accessionNumber, title]
      properties:
        accessionNumber: { type: string, minLength: 1, maxLength: 100 }
        title: { type: string, minLength: 1, maxLength: 300 }
        description: { type: string, maxLength: 20000 }
        termIds: { type: array, maxItems: 50, uniqueItems: true, items: { type: string, format: uuid } }
    UpdateArtifactRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        accessionNumber: { type: string, minLength: 1, maxLength: 100 }
        title: { type: string, minLength: 1, maxLength: 300 }
        description: { type: string, maxLength: 20000 }
        termIds: { type: array, maxItems: 50, uniqueItems: true, items: { type: string, format: uuid } }
    VersionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
    ArchiveResult:
      type: object
      required: [id, archived]
      properties:
        id: { type: string, format: uuid }
        archived: { type: boolean, const: true }
  responses:
    BadRequest:
      description: Input validation failed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: Authentication required or credentials invalid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: Permission denied.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: Duplicate or stale write conflict.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    InternalError:
      description: Unexpected server error; response contains no stack trace.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
